name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify source
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run tests
        run: uv run --no-sync pytest -q

      - name: Run lint
        run: uv run --no-sync ruff check .

      # タグ v2.0.0 と pyproject / __version__ がズレたまま公開すると、
      # 配布バイナリの mdx --version と Release の表示が食い違う。
      - name: タグとバージョンの一致を確認
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "タグ以外の実行のため検証をスキップします"
            exit 0
          fi
          tag="${GITHUB_REF_NAME#v}"
          pyproject=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          module=$(grep -m1 '^__version__ = ' src/mdx_cli/__init__.py | cut -d'"' -f2)
          echo "tag=$tag pyproject=$pyproject __version__=$module"
          if [ "$tag" != "$pyproject" ] || [ "$tag" != "$module" ]; then
            echo "::error::タグ $GITHUB_REF_NAME と version が一致しません"
            exit 1
          fi

  build:
    needs: verify
    strategy:
      matrix:
        include:
          - os: macos-14
            artifact: mdx-darwin-arm64
          - os: ubuntu-24.04
            artifact: mdx-linux-x86_64
          - os: ubuntu-24.04-arm
            artifact: mdx-linux-arm64
          - os: windows-latest
            artifact: mdx-windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Install dependencies
        run: uv sync --group dev

      - name: Build application bundle
        run: uv run pyinstaller --onedir --name mdx src/mdx_cli/main.py

      - name: Package application bundle
        run: python scripts/package_release.py ${{ matrix.artifact }}

      - name: Smoke test installer (Unix)
        if: runner.os != 'Windows'
        env:
          MDX_TEST_BUNDLE_ARCHIVE: ${{ github.workspace }}/dist/${{ matrix.artifact }}.tar.gz
        run: uv run --no-sync pytest tests/test_installers.py -k real_release_bundle -q

      - name: Smoke test installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:MDX_INSTALL_DIR = Join-Path $env:RUNNER_TEMP 'mdx-smoke'
          function Invoke-WebRequest {
            param($Uri, $OutFile, [switch]$UseBasicParsing)
            Copy-Item (Join-Path 'dist' ($Uri.Split('/')[-1])) $OutFile
          }
          & ./install.ps1
          & ./install.ps1
          & "$env:MDX_INSTALL_DIR/mdx.exe" --version
          if ($LASTEXITCODE -ne 0) { throw 'Installed bundle failed to start' }

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/${{ matrix.artifact }}.tar.gz
            dist/${{ matrix.artifact }}.zip
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # install.sh / install.ps1 も同じタグの内容をリリースに添付する
      - uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums.txt
        run: |
          cd artifacts
          sha256sum mdx-* > ../checksums.txt
          mv ../checksums.txt .
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          draft: false
          generate_release_notes: true
          files: |
            artifacts/*
            install.sh
            install.ps1
