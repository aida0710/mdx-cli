[project]
name = "mdx-cli"
version = "1.6.1"
requires-python = ">=3.13"
dependencies = [
    "typer[all]>=0.12",
    "httpx>=0.27",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "keyring>=25.0",
    "cryptography>=42.0",
    "beautifulsoup4>=4.12",
    "questionary>=2.0",
]

[project.scripts]
mdx = "mdx_cli.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mdx_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
    "respx>=0.22",
    "pyinstaller>=6.0",
    "ruff>=0.15.16",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
# E4xx: import配置 / E7xx: 文の誤り / E9xx: 構文エラー / F: 未使用import・未定義名 等
select = ["E4", "E7", "E9", "F"]
